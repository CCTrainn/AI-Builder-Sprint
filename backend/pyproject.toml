[project]
name = "work-rights-companion"
version = "0.1.0"
description = "FastAPI MVP for collecting and comparing everyday work records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<6",
    "supabase>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
