<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근로권리 동반자</title>
  <link rel="stylesheet" href="./shared/tokens.css">
  <link rel="stylesheet" href="./shared/common.css">
  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fcfeff;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;

      display: flex;
      flex-direction: column;

      width: 240px;
      height: 100vh;
      padding: 6px 6px;
      padding-top: 30px;

      background-color: #fcfeff;
      border-right: 1px solid #dfe2e7;
    }

    .sidebar-logo {
      margin-bottom: 28px;
      padding: 0 10px;
    }

    .sidebar-logo a {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #111827;
      text-decoration: none;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      color: white;
      font-weight: bold;
      background-color: #2563eb;
      border-radius: 10px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 11px 12px;

      color: #4b5563;
      font-size: 15px;
      text-decoration: none;

      border-radius: 10px;
      transition: background-color 0.2s, color 0.2s;
    }

    .sidebar-item:hover {
      color: #111827;
      background-color: #f3f4f6;
    }

    .sidebar-item.active {
      color: #1d4ed8;
      font-weight: 600;
      background-color: #eff6ff;
    }

    .sidebar-icon {
      width: 22px;
      text-align: center;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #dfe2e7;
    }

    .profile-button {
      display: flex;
      align-items: center;
      gap: 10px;

      width: 100%;
      padding: 10px;

      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .profile-button:hover {
      background-color: #f3f4f6;
    }

    .profile-image {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 36px;
      height: 36px;

      color: white;
      font-weight: bold;
      background-color: #374151;
      border-radius: 50%;
    }

    .profile-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .profile-info strong {
      color: #111827;
      font-size: 14px;
    }

    .profile-info span {
      color: #9ca3af;
      font-size: 12px;
    }

    .profile-more {
      color: #6b7280;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <!-- 로고 -->
    <div class="sidebar-logo">
      <a href="./index.html">
        <span class="logo-icon">로고</span>
        <span class="logo-text">ㄱㄹㄱㄹ</span>
      </a>
    </div>

    <!-- 메뉴 -->
    <nav class="sidebar-menu">
      <a href="./index.html" class="sidebar-item active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>홈</span>
      </a>

      <a class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open-icon lucide-folder-open"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
        <span>자료 모으기</span>
      </a>

      <a  class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scale-icon lucide-scale"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></svg>
        <span>조건 비교하기</span>
      </a>

      <a class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square-icon lucide-messages-square"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg>
        <span>대화 도우미</span>
      </a>

      <a class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open-icon lucide-book-open"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
        <span>내 기록</span>
      </a>

      <a class="sidebar-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-library-big-icon lucide-library-big"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/></svg>
        <span>비슷한 경험</span>
      </a>
    </nav>

    <!-- 하단 영역 -->
    <div class="sidebar-bottom">

      <button type="button" class="profile-button">
        <div class="profile-image">프사</div>

        <div class="profile-info">
          <strong>name</strong>
        </div>

        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu-icon lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
    </div>
  </aside>

  <script type="module" src="./shared/app.js"></script>
</body>

</html>
