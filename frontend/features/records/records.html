<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자료 모으기 | 근로권리 동반자</title>
  <link rel="stylesheet" href="../../shared/tokens.css">
  <link rel="stylesheet" href="../../shared/common.css">
  <link rel="stylesheet" href="./records.css">
  <link rel="stylesheet" href="../../shared/sidebar.css?v=20260803-3">
  <link rel="stylesheet" href="../../shared/polish.css">
</head>
<body class="has-app-sidebar" data-page="records">
  <div id="appSidebar" class="app-sidebar-root"></div>

  <main class="records-page">
    <header class="page-header">
      <div>
        <h1>자료 모으기</h1>
        <p class="page-description">계약서, 급여명세서, 근무기록을 한곳에 모아 시간순으로 확인하세요.</p>
      </div>
      <a class="header-action" href="../comparison/comparison.html">
        기록 비교하기
        <span aria-hidden="true">→</span>
      </a>
    </header>

    <section class="record-summary" aria-label="근무자료 현황">
      <article>
        <span>전체 자료</span>
        <strong id="totalRecordCount">0</strong>
      </article>
      <article>
        <span>분석 완료</span>
        <strong id="completedRecordCount">0</strong>
      </article>
      <article>
        <span>처리 중</span>
        <strong id="processingRecordCount">0</strong>
      </article>
      <article>
        <span>확인 필요</span>
        <strong id="failedRecordCount">0</strong>
      </article>
    </section>

    <div class="records-layout">
      <section class="upload-card" aria-labelledby="upload-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">새 자료</p>
            <h2 id="upload-title">근무자료 추가</h2>
          </div>
          <span class="private-badge">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            비공개
          </span>
        </div>

        <form id="uploadForm" novalidate>
          <label id="dropzone" class="dropzone" for="recordFile">
            <span class="dropzone__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 16V4M7 9l5-5 5 5"/>
                <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>
              </svg>
            </span>
            <strong id="filePrompt">파일이나 사진을 선택하세요</strong>
            <span id="fileHint">PDF, JPG, PNG · 최대 10MB</span>
            <input id="recordFile" name="file" type="file" accept=".pdf,image/jpeg,image/png" required>
          </label>

          <div class="form-field">
            <label for="recordType">자료 종류</label>
            <select id="recordType" name="record_type" required>
              <option value="">종류를 선택하세요</option>
              <option value="job_posting">채용공고</option>
              <option value="employment_contract">근로계약서</option>
              <option value="employer_message">고용주 대화</option>
              <option value="verbal_memo">구두 약속 메모</option>
              <option value="work_schedule">근무표</option>
              <option value="attendance">출퇴근 기록</option>
              <option value="payslip">급여명세서</option>
              <option value="bank_deposit">입금내역</option>
              <option value="workplace_notice">사업장 공지</option>
              <option value="other">기타</option>
            </select>
          </div>

          <div class="form-field">
            <label for="recordedAt">자료의 날짜</label>
            <input id="recordedAt" name="recorded_at" type="date" required>
            <small>문서에 적힌 날짜나 자료를 받은 날짜를 입력하세요.</small>
          </div>

          <p id="uploadError" class="form-error" role="alert" hidden></p>

          <button id="uploadButton" class="primary-button" type="submit">
            <span>자료 추가하기</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

        <p class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          원본 파일은 비공개 저장소에 보관됩니다.
        </p>
      </section>

      <section class="timeline-card" aria-labelledby="timeline-title">
        <div class="timeline-header">
          <div>
            <p class="section-kicker">타임라인</p>
            <h2 id="timeline-title">모아둔 근무자료</h2>
          </div>

          <div class="timeline-filters">
            <label class="visually-hidden" for="typeFilter">자료 종류 필터</label>
            <select id="typeFilter">
              <option value="all">모든 종류</option>
              <option value="job_posting">채용공고</option>
              <option value="employment_contract">근로계약서</option>
              <option value="work_schedule">근무표</option>
              <option value="attendance">출퇴근 기록</option>
              <option value="payslip">급여명세서</option>
              <option value="bank_deposit">입금내역</option>
              <option value="other">기타</option>
            </select>

            <label class="visually-hidden" for="statusFilter">처리 상태 필터</label>
            <select id="statusFilter">
              <option value="all">모든 상태</option>
              <option value="completed">분석 완료</option>
              <option value="processing">처리 중</option>
              <option value="failed">확인 필요</option>
            </select>
          </div>
        </div>

        <div id="recordsState" class="state-panel" aria-live="polite"></div>
        <div id="recordsList" class="records-list" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <dialog id="recordDialog" class="record-dialog">
    <div class="record-dialog__header">
      <div>
        <span id="dialogType" class="record-dialog__type"></span>
        <h2 id="dialogTitle">자료 상세</h2>
      </div>
      <button id="dialogClose" class="icon-button" type="button" aria-label="닫기">×</button>
    </div>
    <div id="dialogContent" class="record-dialog__content"></div>
    <div class="record-dialog__actions">
      <button id="deleteRecordButton" class="danger-button" type="button">자료 삭제</button>
      <button id="dialogConfirm" class="secondary-button" type="button">확인</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../../shared/app.js?v=20260803-13"></script>
  <script type="module" src="./records.js"></script>
</body>
</html>
